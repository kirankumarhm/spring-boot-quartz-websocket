spring:
  config:
    activate:
      on-profile: h2

  datasource:
    url: jdbc:h2:mem:quartzdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  quartz:
    job-store-type: memory

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
